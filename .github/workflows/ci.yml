name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The example documents the golden test reads live in the pinned
          # submodule (design.md D20).
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

  browser:
    # Layout is the one thing the unit tests cannot see (dev-notes D26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: web

      - run: npm run test:e2e
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
