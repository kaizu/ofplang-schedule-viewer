name: Publish

# Tag-driven release via PyPI Trusted Publishing (OIDC) — no API tokens. The
# same routine as the sibling repositories (ofplang/validate), plus one step:
# the viewer template is built from web/ and packed into the wheel, so a
# release's command and the page it writes always come from the same commit.
#
# Version comes from the pushed git tag via setuptools-scm (`v0.1.0` -> 0.1.0).
# Routing:
#   - a pre-release tag containing `rc` (e.g. v0.1.0rc1) -> TestPyPI (rehearsal)
#   - any other `v*` tag (e.g. v0.1.0)                    -> PyPI (production)
#   - manual workflow_dispatch -> choose the target explicitly (run it from a
#     tagged commit, else setuptools-scm yields a dev+local version PyPI rejects)
#
# PyPI-side setup (done once, by the project owner, 2026-09-27): a Trusted
# Publisher for owner=ofplang, repo=export, workflow=publish.yml,
# environment=pypi (and environment=testpypi on TestPyPI), registered "pending".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # setuptools-scm derives the version from tags + history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build:single
        working-directory: web
      # The same build as a module, for thin pages (design.md D68); the `cdn` job publishes it.
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-cdn
          path: web/dist-cdn/ofp-view.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel carries the template
        run: python -m zipfile -l dist/*.whl | grep -q "ofplang/export/_template/viewer.html"
      # Guard against ambiguous tags: the built version (from setuptools-scm) must
      # equal the pushed tag — e.g. tag v0.1.0 must build 0.1.0.
      - name: Verify built version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's#.*/[^/]*-([0-9][^-]*)\.tar\.gz#\1#')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::built version $built != tag $tag (ambiguous or misplaced tag?)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # A released version's viewer for thin pages (design.md D68): committed to the
  # `cdn` branch and tagged `cdn-v<version>`, which jsdelivr serves as
  #   https://cdn.jsdelivr.net/gh/ofplang/export@cdn-v<version>/ofp-view.js
  # — the URL `ofp-export view --thin` of that version writes. It runs before
  # either publish job, so no published version points at a file that is not
  # there. The tag does not match `v*`, so pushing it starts nothing here.
  cdn:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: viewer-cdn
          path: ${{ runner.temp }}/cdn
      - name: Commit to the cdn branch and tag it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin cdn >/dev/null; then
            git fetch origin cdn
            git switch cdn
          else
            # The first release: a branch with no history of main in it.
            git switch --orphan cdn
          fi
          cp "$RUNNER_TEMP/cdn/ofp-view.js" ofp-view.js
          cat > README.md <<'EOF'
          # cdn

          Built viewers for thin pages, one commit per release of ofplang/export. Nothing
          here is edited by hand: the release workflow (`.github/workflows/publish.yml`
          on main) builds `ofp-view.js` from the tagged commit, commits it here and tags
          the commit `cdn-v<version>`, which jsdelivr serves as

              https://cdn.jsdelivr.net/gh/ofplang/export@cdn-v<version>/ofp-view.js
          EOF
          git add ofp-view.js README.md
          git commit -m "ofp-view.js for v$version" -m "Built from $GITHUB_SHA by the release workflow."
          git tag -a "cdn-v$version" -m "ofp-view.js for v$version, built from $GITHUB_SHA"
          git push origin cdn "cdn-v$version"
      - name: jsdelivr serves it
        shell: bash
        run: |
          url="https://cdn.jsdelivr.net/gh/ofplang/export@cdn-v${GITHUB_REF_NAME#v}/ofp-view.js"
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 15
          done
          echo "::error::jsdelivr does not serve $url"
          exit 1

  publish-testpypi:
    needs: [build, cdn]
    # A manual run has no tag, so no cdn job; a tag push publishes only once its viewer is served.
    if: >-
      always() && needs.build.result == 'success'
      && (needs.cdn.result == 'success' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
      || (github.event_name == 'push' && contains(github.ref_name, 'rc')))
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, cdn]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.cdn.result == 'success' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
      || (github.event_name == 'push' && !contains(github.ref_name, 'rc')))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
