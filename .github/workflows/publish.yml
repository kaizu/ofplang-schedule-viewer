name: Publish

# Tag-driven release via PyPI Trusted Publishing (OIDC) — no API tokens. The
# same routine as the sibling repositories (ofplang/validate), plus one step:
# the viewer template is built from web/ and packed into the wheel, so a
# release's command and the page it writes always come from the same commit.
#
# Version comes from the pushed git tag via setuptools-scm (`v0.1.0` -> 0.1.0).
# Routing:
#   - a pre-release tag containing `rc` (e.g. v0.1.0rc1) -> TestPyPI (rehearsal)
#   - any other `v*` tag (e.g. v0.1.0)                    -> PyPI (production)
#   - manual workflow_dispatch -> choose the target explicitly (run it from a
#     tagged commit, else setuptools-scm yields a dev+local version PyPI rejects)
#
# PyPI-side setup (done once, by the project owner, 2026-09-27): a Trusted
# Publisher for owner=ofplang, repo=export, workflow=publish.yml,
# environment=pypi (and environment=testpypi on TestPyPI), registered "pending".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # setuptools-scm derives the version from tags + history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build:single
        working-directory: web
      # The same build as a module, for thin pages (design.md D68); the `npm` job publishes it.
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-cdn
          path: web/dist-cdn/ofp-view.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel carries the template
        run: python -m zipfile -l dist/*.whl | grep -q "ofplang/export/_template/viewer.html"
      # Guard against ambiguous tags: the built version (from setuptools-scm) must
      # equal the pushed tag — e.g. tag v0.1.0 must build 0.1.0.
      - name: Verify built version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's#.*/[^/]*-([0-9][^-]*)\.tar\.gz#\1#')"
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::built version $built != tag $tag (ambiguous or misplaced tag?)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # A released version's viewer for thin pages (design.md D68, D69): published
  # to npm as @ofplang/export-viewer, which jsDelivr serves as
  #   https://cdn.jsdelivr.net/npm/@ofplang/export-viewer@<version>/ofp-view.js
  # — the URL `ofp-export view --thin` of that version writes. npm, not a
  # branch of this repository: a claude.ai artifact may load scripts from
  # jsDelivr's /npm/ only. Trusted publishing (OIDC, no token) — the publisher
  # registered on npmjs.com is ofplang/export, publish.yml, environment npm. It
  # runs before either Python publish job, so no published version points at a
  # file that is not there. A release candidate `v0.1.5rc2` is `0.1.5-rc.2`
  # under the dist-tag `rc`, leaving `latest` on the last release.
  npm:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: viewer-cdn
          path: ${{ runner.temp }}/viewer
      - name: Publish @ofplang/export-viewer
        id: publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm_version="$(printf '%s' "$version" | sed -E 's/rc([0-9]+)$/-rc.\1/')"
          tag=latest
          case "$npm_version" in *-rc.*) tag=rc ;; esac
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg"
          cp web/npm/package.json web/npm/README.md LICENSE "$RUNNER_TEMP/viewer/ofp-view.js" "$pkg/"
          cd "$pkg"
          npm version --no-git-tag-version "$npm_version"
          npm publish --provenance --access public --tag "$tag"
          echo "url=https://cdn.jsdelivr.net/npm/@ofplang/export-viewer@$npm_version/ofp-view.js" >> "$GITHUB_OUTPUT"
      - name: jsDelivr serves it
        shell: bash
        run: |
          url="${{ steps.publish.outputs.url }}"
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 15
          done
          echo "::error::jsDelivr does not serve $url"
          exit 1

  publish-testpypi:
    needs: [build, npm]
    # A manual run has no tag, so no npm job; a tag push publishes only once its viewer is served.
    if: >-
      always() && needs.build.result == 'success'
      && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
      || (github.event_name == 'push' && contains(github.ref_name, 'rc')))
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, npm]
    if: >-
      always() && needs.build.result == 'success'
      && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
      || (github.event_name == 'push' && !contains(github.ref_name, 'rc')))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
