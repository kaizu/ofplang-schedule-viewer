# The bench plate_assay.workflow.yaml runs on. Two arms: a small one for tubes
# and a plate gripper, so tubes and plates move at the same time but each arm
# does one thing at a time. The liquid handler has one tube position, so the
# samples queue for it; the incubator only holds the plate (device_access:
# false), so the handler, washer and reader stay free while it incubates. One
# incubator position is enough: there is one assay plate.
#
# Minutes throughout. The numbers are plausible, not measured.
time:
  unit: minute

devices:
  - id: rack                                    # where the entry material starts
    spots: [tube_1, tube_2, tube_3, plate]
  - id: labeller                                # issues fresh, labelled plates
    spots: [out]
  - id: handler                                 # liquid handler
    spots: [plate_a, plate_b, tube]
  - id: sealer
    spots: [stage]
  - id: incubator
    spots: [slot]
  - id: washer
    spots: [stage]
  - id: reader
    spots: [stage]
  - id: waste
    spots: [tube_bin, plate_bin]
  - id: exit                                    # where the finished plate is left
    spots: [stack]

transporters:
  - id: tube_arm
  - id: plate_arm

transports:
  # tubes
  - { transporter: tube_arm, from: rack.tube_1, to: handler.tube, duration: 1 }
  - { transporter: tube_arm, from: rack.tube_2, to: handler.tube, duration: 1 }
  - { transporter: tube_arm, from: rack.tube_3, to: handler.tube, duration: 1 }
  - { transporter: tube_arm, from: handler.tube, to: waste.tube_bin, duration: 1 }
  # plates onto and off the handler
  - { transporter: plate_arm, from: labeller.out, to: handler.plate_a, duration: 2 }
  - { transporter: plate_arm, from: rack.plate, to: handler.plate_b, duration: 2 }
  - { transporter: plate_arm, from: handler.plate_b, to: waste.plate_bin, duration: 2 }
  # the assay plate round the bench
  - { transporter: plate_arm, from: handler.plate_a, to: sealer.stage, duration: 2 }
  - { transporter: plate_arm, from: sealer.stage, to: incubator.slot, duration: 2 }
  - { transporter: plate_arm, from: incubator.slot, to: washer.stage, duration: 2 }
  - { transporter: plate_arm, from: washer.stage, to: handler.plate_a, duration: 2 }
  - { transporter: plate_arm, from: handler.plate_a, to: incubator.slot, duration: 2 }
  - { transporter: plate_arm, from: incubator.slot, to: reader.stage, duration: 2 }
  - { transporter: plate_arm, from: reader.stage, to: exit.stack, duration: 2 }

processes:
  new_plate:
    modes:
      - devices: [labeller]
        duration: 2
        output_spots: { plate: labeller.out }
  add_standards:
    modes:
      - devices: [handler]
        duration: 8
        input_spots:  { plate: handler.plate_a, standards: handler.plate_b }
        output_spots: { plate: handler.plate_a, standards: handler.plate_b }
  discard_plate:
    modes:
      - devices: [waste]
        duration: 1
        input_spots: { plate: waste.plate_bin }
  transfer:
    modes:
      - devices: [handler]
        duration: 4
        input_spots:  { plate: handler.plate_a, tube: handler.tube }
        output_spots: { plate: handler.plate_a, tube: handler.tube }
  discard_tube:
    modes:
      - devices: [waste]
        duration: 1
        input_spots: { tube: waste.tube_bin }
  seal:
    modes:
      - devices: [sealer]
        duration: 2
        input_spots:  { plate: sealer.stage }
        output_spots: { plate: sealer.stage }
  incubate:
    modes:
      - devices: [incubator]
        device_access: false
        duration: 30
        input_spots:  { plate: incubator.slot }
        output_spots: { plate: incubator.slot }
  wash:
    modes:
      - devices: [washer]
        duration: 6
        input_spots:  { plate: washer.stage }
        output_spots: { plate: washer.stage }
  add_detection:
    modes:
      - devices: [handler]
        duration: 4
        input_spots:  { plate: handler.plate_a }
        output_spots: { plate: handler.plate_a }
  read:
    modes:
      - devices: [reader]
        duration: 3
        input_spots:  { plate: reader.stage }
        output_spots: { plate: reader.stage }
  analyze:
    modes:
      - { id: curve_fit, duration: 0 }
